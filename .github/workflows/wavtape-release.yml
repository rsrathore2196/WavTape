name: WavTape Release

on:
  workflow_dispatch:

permissions: {}

env:
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  preflight:
    if: github.repository == 'rsrathore2196/WavTape' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify release branch and signing environment policies
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$GITHUB_REF" == refs/heads/release && "$REF_PROTECTED" == true ]] ||
            fail 'Dispatch this workflow from the protected release branch.'
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          get() {
            curl --fail --silent --show-error --retry 2 --max-time 15 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$api/$1"
          }

          # GitHub returns effective active rules for this branch, including rulesets.
          rules=$(get 'rules/branches/release?per_page=100') ||
            fail 'Unable to read effective release rules.'
          jq -e '
            type == "array" and length < 100 and
            (map(.type) | index("pull_request") != null and
              index("non_fast_forward") != null and index("deletion") != null) and
            all(.[]; (.ruleset_id | type == "number" and . > 0))
          ' <<< "$rules" >/dev/null || fail 'Release must require PRs and block force pushes and deletion.'

          # Treat a redacted bypass list as unverifiable, even if all required rules are active.
          ruleset_ids=$(jq -r 'map(.ruleset_id) | unique[]' <<< "$rules")
          while IFS= read -r ruleset_id; do
            ruleset=$(get "rulesets/$ruleset_id?includes_parents=true") ||
              fail 'Unable to read an effective release ruleset.'
            jq -e --argjson id "$ruleset_id" '
              .id == $id and .enforcement == "active" and .target == "branch" and .bypass_actors == []
            ' <<< "$ruleset" >/dev/null || fail 'An effective ruleset has bypass actors or its bypass list is unavailable.'
          done <<< "$ruleset_ids"

          environment=$(get 'environments/release-signing') ||
            fail 'Unable to read the release-signing environment.'
          jq -e '
            .name == "release-signing" and
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false
          ' <<< "$environment" >/dev/null || fail 'Select specific deployment branches for release-signing.'

          allowed=$(get 'environments/release-signing/deployment-branch-policies?per_page=100') ||
            fail 'Unable to read the release-signing allowlist.'
          jq -e '
            .total_count == 1 and (.branch_policies | length) == 1 and
            .branch_policies[0].type == "branch" and .branch_policies[0].name == "release"
          ' <<< "$allowed" >/dev/null || fail 'Allow exactly the release branch in release-signing.'

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      unsigned-apk-id: ${{ steps.stage-apk.outputs.artifact-id }}
    steps:
      - name: Check out the dispatched release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager can stop reading once all licenses have been accepted.
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" 'platforms;android-37.0' "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Build unsigned release APK
        shell: bash
        run: bash ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease -PwavtapeUnsignedRelease=true

      - name: Stage unsigned APK for the signing job
        id: stage-apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-signing-input
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [preflight, build]
    if: github.repository == 'rsrathore2196/WavTape' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 10
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android signing tools
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Download this run's unsigned APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.unsigned-apk-id }}
          path: ${{ runner.temp }}/wavtape-input

      - name: Validate and align release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/wavtape-input/app-release-unsigned.apk"
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo '::error::The release APK is debuggable.'
            exit 1
          fi
          if ! grep -q "^package: name='com\.aistudio\.xtremeplayer\.vkmz' " <<< "$badging"; then
            echo '::error::The APK has an unexpected application ID.'
            exit 1
          fi
          "$build_tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/wavtape-input/aligned.apk"

      - name: Sign release APK with the permanent keystore
        shell: bash
        env:
          WAVTAPE_KEYSTORE_BASE64: ${{ secrets.WAVTAPE_KEYSTORE_BASE64 }}
          WAVTAPE_STORE_PASSWORD: ${{ secrets.WAVTAPE_STORE_PASSWORD }}
          WAVTAPE_KEY_ALIAS: ${{ secrets.WAVTAPE_KEY_ALIAS }}
          WAVTAPE_KEY_PASSWORD: ${{ secrets.WAVTAPE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WAVTAPE_KEYSTORE_BASE64:?Missing WAVTAPE_KEYSTORE_BASE64}"
          : "${WAVTAPE_STORE_PASSWORD:?Missing WAVTAPE_STORE_PASSWORD}"
          : "${WAVTAPE_KEY_PASSWORD:?Missing WAVTAPE_KEY_PASSWORD}"
          if [[ "$WAVTAPE_KEY_ALIAS" != wavtape-release ]]; then
            echo '::error::WAVTAPE_KEY_ALIAS must be wavtape-release.'
            exit 1
          fi

          umask 077
          signing_dir="$RUNNER_TEMP/wavtape-signing"
          mkdir -- "$signing_dir"
          trap 'rm -rf -- "$signing_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          keystore="$signing_dir/WavTape-release.p12"
          printf '%s' "$WAVTAPE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset WAVTAPE_KEYSTORE_BASE64
          if [[ ! -s "$keystore" ]]; then
            echo '::error::The decoded WavTape signing keystore is empty.'
            exit 1
          fi

          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$WAVTAPE_KEY_ALIAS" \
            --ks-pass env:WAVTAPE_STORE_PASSWORD --key-pass env:WAVTAPE_KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-release.apk" "$RUNNER_TEMP/wavtape-input/aligned.apk"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP:?}/wavtape-signing"

      - name: Verify APK signature and signing certificate
        shell: bash
        env:
          WAVTAPE_SIGNER_SHA256: ${{ vars.WAVTAPE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$WAVTAPE_SIGNER_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo '::error::Set WAVTAPE_SIGNER_SHA256 to the permanent certificate SHA-256 fingerprint.'
            exit 1
          fi
          verification=$("$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/app-release.apk")
          mapfile -t signers < <(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: (.*)$/\1/p' <<< "$verification")
          if (( ${#signers[@]} != 1 )) || [[ "${signers[0]^^}" != "$expected" ]]; then
            echo '::error::The APK must have exactly one signer matching WAVTAPE_SIGNER_SHA256.'
            exit 1
          fi

      - name: Upload verified release APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: WavTape-release-apk
          path: ${{ runner.temp }}/app-release.apk
          if-no-files-found: error
